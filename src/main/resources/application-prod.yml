spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:gomech_prod}?cloudSqlInstance=${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
  flyway:
    enabled: true
    baseline-on-migrate: false
