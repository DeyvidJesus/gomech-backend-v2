spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gomech_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

gomech:
  tenancy:
    # Local development only: lets a developer exercise tenant-scoped endpoints by hand before the
    # tenant-aware login story is finished. Never enabled in dev, staging or prod.
    trust-request-header: true
