spring:
  application:
    name: GoMechV2-API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: com.gomech.api.core.tenancy.HibernateTenantIdentifierResolver

gomech:
  ai:
    base-url: ${GOMECH_AI_BASE_URL:http://localhost:8000}
    service-secret: ${GOMECH_AI_SERVICE_SECRET:gm-ai-internal-hmac-secret}
    id-token-audience: ${GOMECH_AI_ID_TOKEN_AUDIENCE:}
    connect-timeout-ms: ${GOMECH_AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GOMECH_AI_READ_TIMEOUT_MS:15000}
    max-retries: ${GOMECH_AI_MAX_RETRIES:3}
    backoff-base-ms: ${GOMECH_AI_BACKOFF_BASE_MS:150}
  tenancy:
    # Whether the X-Tenant-ID header may select a tenant on the public login endpoint.
    # Off everywhere unless a profile explicitly opts in: a caller-provided tenant is never an
    # identity, and deployed environments must derive tenancy from the access token only.
    trust-request-header: false
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback/google}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://openidconnect.googleapis.com/v1/userinfo
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer: https://accounts.google.com

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 900000 # 15 minutos em ms
  refresh-expiration: 604800000 # 7 dias em ms

pagarme:
  api-key: ${PAGARME_API_KEY:sk_test_gomech_placeholder}
  api-url: ${PAGARME_API_URL:https://api.pagar.me/core/v5}
  webhook-secret: ${PAGARME_WEBHOOK_SECRET:whsec_gomech_placeholder}
  mock-enabled: ${PAGARME_MOCK_ENABLED:false}

logging:
  pattern:
    # Injects the correlation id into Spring Boot's default layout instead of replacing it, so every
    # log line for a request is attributable without redefining the whole pattern.
    level: "%5p [%X{correlation_id:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
